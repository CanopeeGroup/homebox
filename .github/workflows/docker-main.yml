name: Docker main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test collection assignment and compile API
        working-directory: backend
        run: go test -tags nodynamic ./internal/data/repo ./app/api -run 'TestAdminDefaultCollectionMembership|TestTenantCollectionAssignment' -count=1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Prepare Nuxt
        working-directory: frontend
        run: pnpm exec nuxt prepare
      - name: Test assigned collections
        working-directory: frontend
        run: pnpm exec vitest run --config test/vitest.collections.config.ts
      - name: Test consecutive creations
        working-directory: frontend
        run: pnpm exec vitest run --config test/vitest.entity-create.config.ts

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/canopeegroup/homebox
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=main
          cache-from: type=gha
          cache-to: type=gha,mode=max
